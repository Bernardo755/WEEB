<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mejorar Webcam con Código</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; }
        video { display: none; } /* Ocultamos el video crudo */
        canvas { border: 2px solid #007bff; border-radius: 8px; max-width: 100%; }
        .controls { margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Mejora de Imagen de Webcam en Tiempo Real</h2>
    
    <!-- Elementos multimedia -->
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <div class="controls">
        <label>Brillo: <input type="range" id="brightness" min="-100" max="100" value="15"></label>
        <label>Contraste: <input type="range" id="contrast" min="0" max="2" step="0.1" value="1.2"></label>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });

        const brightnessInput = document.getElementById('brightness');
        const contrastInput = document.getElementById('contrast');

        // 1. Inicializar la cámara web
        async function iniciarCamara() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    procesarFrame();
                };
            } catch (err) {
                alert("No se pudo acceder a la cámara: " + err);
            }
        }

        // 2. Procesar cada fotograma (Frame)
        function procesarFrame() {
            if (video.paused || video.ended) return;

            // Dibujar el video actual en el canvas
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Obtener los píxeles para modificar brillo y contraste
            let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            let data = imageData.data;
            
            let brightness = parseInt(brightnessInput.value);
            let contrast = parseFloat(contrastInput.value);

            // Algoritmo básico de ajuste de brillo y contraste por píxel
            for (let i = 0; i < data.length; i += 4) {
                // Aplicar contraste y brillo a los canales Rojo, Verde y Azul
                for (let j = 0; j < 3; j++) {
                    let val = data[i + j];
                    val = val * contrast + brightness; // Fórmula de ajuste
                    data[i + j] = Math.min(255, Math.max(0, val)); // Limitar entre 0 y 255
                }
            }

            // Devolver los píxeles modificados al canvas
            ctx.putImageData(imageData, 0, 0);

            // Repetir en el siguiente ciclo de animación
            requestAnimationFrame(procesarFrame);
        }

        iniciarCamara();
    </script>
</body>
</html>
