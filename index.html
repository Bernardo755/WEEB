<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Webcam con OpenCV.js, Controles de Luz y Estado</title>
    <!-- Cargar OpenCV.js de forma asíncrona -->
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" type="text/javascript"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #222; color: #fff; margin: 0; padding: 20px; }
        video { display: none; }
        canvas { border: 2px solid #007bff; border-radius: 8px; max-width: 100%; margin-top: 15px; }
        .controls { margin-top: 15px; display: flex; gap: 15px; justify-content: center; align-items: center; flex-wrap: wrap; background: #333; padding: 15px; border-radius: 8px; }
        button { background-color: #28a745; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { opacity: 0.9; }
        button.off { background-color: #dc3545; }
        select, input[type="range"] { padding: 6px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .slider-group { display: flex; flex-direction: column; align-items: center; font-size: 14px; gap: 5px; }
    </style>
</head>
<body>

    <h2>Procesamiento de Webcam con OpenCV.js y Ajustes de Luz</h2>

    <div class="controls">
        <button id="btnToggle" onclick="toggleCamara()">Encender Cámara</button>
        
        <div class="slider-group">
            <label for="brightness">Brillo: <span id="valBrightness">0</span></label>
            <input type="range" id="brightness" min="-100" max="100" value="0" oninput="document.getElementById('valBrightness').innerText=this.value">
        </div>

        <div class="slider-group">
            <label for="contrast">Contraste: <span id="valContrast">1.0</span></label>
            <input type="range" id="contrast" min="0.5" max="2.0" step="0.1" value="1.0" oninput="document.getElementById('valContrast').innerText=this.value">
        </div>

        <label>Filtro OpenCV: 
            <select id="filtro">
                <option value="normal">Normal (Con Ajustes de Luz)</option>
                <option value="gris">Escala de Grises</option>
                <option value="canny">Detección de Bordes (Canny)</option>
            </select>
        </label>
    </div>
    
    <video id="webcam" autoplay playsinline></video>
    <canvas id="outputCanvas"></canvas>

    <script>
        let video = document.getElementById('webcam');
        let canvas = document.getElementById('outputCanvas');
        let btnToggle = document.getElementById('btnToggle');
        let streaming = false;
        let stream = null;

        function toggleCamara() {
            if (!streaming) {
                iniciarCamara();
            } else {
                detenerCamara();
            }
        }

        async function iniciarCamara() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = stream;
                video.play();
                
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    streaming = true;
                    btnToggle.innerText = "Apagar Cámara";
                    btnToggle.classList.add('off');
                    procesarFrame();
                };
            } catch (err) {
                alert("No se pudo acceder a la cámara: " + err);
            }
        }

        function detenerCamara() {
            if (stream) {
                let tracks = stream.getTracks();
                tracks.forEach(track => track.stop());
                video.srcObject = null;
            }
            streaming = false;
            btnToggle.innerText = "Encender Cámara";
            btnToggle.classList.remove('off');
            
            let ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function procesarFrame() {
            if (!streaming) return;

            let ctx = canvas.getContext('2d', { willReadFrequently: true });
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (typeof cv !== 'undefined' && cv.Mat) {
                try {
                    let src = cv.imread(canvas);
                    let dst = new cv.Mat();
                    let tipoFiltro = document.getElementById('filtro').value;

                    // Obtener valores de los controles deslizantes de luz
                    let brightness = parseInt(document.getElementById('brightness').value);
                    let contrast = parseFloat(document.getElementById('contrast').value);

                    // Aplicar brillo y contraste usando la función nativa de OpenCV (convertTo)
                    // dst = src * alpha (contraste) + beta (brillo)
                    src.convertTo(src, -1, contrast, brightness);

                    if (tipoFiltro === 'gris') {
                        cv.cvtColor(src, dst, cv.COLOR_RGBA2GRAY);
                        cv.imshow(canvas, dst);
                    } else if (tipoFiltro === 'canny') {
                        let gray = new cv.Mat();
                        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
                        cv.Canny(gray, dst, 50, 150);
                        cv.imshow(canvas, dst);
                        gray.delete();
                    } else {
                        cv.imshow(canvas, src);
                    }

                    src.delete();
                    dst.delete();
                } catch (e) {
                    console.error(e);
                }
            }

            requestAnimationFrame(procesarFrame);
        }
    </script>
</body>
</html>
